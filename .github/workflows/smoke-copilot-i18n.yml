name: Smoke Offline Chinese Localization

on:
  push:
    branches:
      - fix/copilot-i18n-v2

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Argos Translate
        run: pip install argostranslate
      - name: Live offline translation smoke test
        shell: bash
        run: |
          python - <<'PY'
          import argostranslate.package
          import argostranslate.translate

          argostranslate.package.update_package_index()
          packages = argostranslate.package.get_available_packages()
          package = next(p for p in packages if p.from_code == 'en' and p.to_code == 'zh')
          argostranslate.package.install_from_path(package.download())

          samples = [
              'A CLI that writes and maintains documentation for your codebase.',
              'A privacy-first app that removes watermarks from content you own.',
              'Multiplayer agent harness for work.',
          ]
          for text in samples:
              translated = argostranslate.translate.translate(text, 'en', 'zh')
              print(text, '=>', translated)
              assert translated and translated != text
          PY
